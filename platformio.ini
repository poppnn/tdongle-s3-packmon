; poppn packmon — two board targets from one repo.
;   env:lilygo-t-dongle-s3  -> src/main.cpp        (ESP32-S3, SD card, USB MSC)
;   env:m5stick-c-plus2     -> src/m5/main.cpp     (ESP32, LittleFS, Web UI)

[env:lilygo-t-dongle-s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = dio
board_build.cdc_on_boot = 0

; USB in TinyUSB / OTG mode (ARDUINO_USB_MODE=0) so the device can present a
; composite CDC + Mass-Storage interface. CDC is started manually in setup()
; after the MSC interface is registered, so serial and the USB drive coexist.
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

build_src_filter = +<*> -<m5/>

lib_deps =
    moononournation/GFX Library for Arduino @ 1.3.7
    fastled/FastLED @ 3.6.0

monitor_speed = 115200
upload_speed = 921600

[env:m5stick-c-plus2]
platform = espressif32@6.5.0
board = m5stick-c
framework = arduino

board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_m5.csv

; Only compile the M5 source for this env.
build_src_filter = -<*> +<m5/>

lib_deps =
    m5stack/M5Unified @ ^0.1.16

monitor_speed = 115200
upload_speed = 1500000
